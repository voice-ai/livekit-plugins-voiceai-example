[project]
name = "livekit-voice-agent-example"
version = "0.1.0"
description = "Example voice agent using LiveKit Agents with Voice.ai TTS"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "livekit-agents>=1.3.0",
    "livekit-plugins-openai>=1.3.0",
    "livekit-plugins-silero>=1.3.0",
    "livekit-plugins-turn-detector>=1.3.0",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

